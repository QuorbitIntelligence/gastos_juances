<!-- Gastos Juances v2.2.0 -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17191E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gastos J">
<title>Gastos Juances</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --accent:#C8102E; --accent-d:#9E0B22; --accent-soft:#FBEDEF;
  --ink:#16181D; --ink2:#2B2E35; --muted:#6B6F78; --faint:#9A9DA5; --line:#E6E6E9; --line2:#F0F0F2;
  --bg:#F5F5F6; --card:#FFFFFF; --soft:#FAFAFB; --field:#FFFFFF;
  --pos:#1F7A4D; --neg:#C8102E; --warn:#A66A0E; --info:#2F4A6D;
  --primary:#16181D; --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --serif: ui-serif,"New York","Iowan Old Style",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#EDEDEF;--ink2:#D4D5D9;--muted:#9A9DA5;--faint:#6F727A;--line:#2A2D33;--line2:#22252B;--bg:#0E0F12;--card:#17191E;--soft:#1C1F25;--field:#1C1F25;
  --accent:#E5394F;--accent-soft:#3A1219;--pos:#4CC38A;--neg:#F0596C;--warn:#E0A94A;--info:#8FB0D9;--primary:#EDEDEF}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14.5px;line-height:1.35;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(76px + var(--sab))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;text-align:inherit}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}
.ico{width:13px;height:13px;vertical-align:-1px;flex:none}

/* Header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;gap:12px}
.top:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accent)}
.top svg.logo{width:34px;height:34px;border-radius:9px;flex:none}
.top .tt{flex:1;min-width:0}
.top h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.sync{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:6px;height:6px;border-radius:50%;background:var(--pos);flex:none}
.dot.off{background:var(--warn)}
.dot.spin{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.iconbtn svg{width:17px;height:17px}
.demo{background:var(--soft);color:var(--muted);font-size:11.5px;padding:6px 16px;text-align:center;border-bottom:1px solid var(--line);letter-spacing:.01em}

main{max-width:1040px;margin:0 auto;padding:14px 14px 24px}
.sec{margin:24px 2px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec .link{text-transform:none;letter-spacing:0;color:var(--accent);font-weight:600;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card+.card{margin-top:10px}

/* Hero */
.hero{border-radius:12px;padding:18px 18px 16px;color:#fff;background:#16181D;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.hero .lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:#A7AAB2}
.hero .big{font-family:var(--serif);font-size:34px;font-weight:600;letter-spacing:-.01em;margin:6px 0 2px}
.hero .big.hneg{color:#FF7A8A}
.hero .sub{font-size:12px;color:#A7AAB2}
.hero .row{display:grid;grid-template-columns:1fr 1fr;margin-top:14px;border-top:1px solid #2C2F36}
.hchip{padding:10px 0 0;font-size:11px;color:#A7AAB2;text-transform:uppercase;letter-spacing:.06em}
.hchip+.hchip{padding-left:14px;border-left:1px solid #2C2F36}
.hchip b{display:block;font-size:16px;margin-top:3px;color:#fff;font-weight:600;letter-spacing:0;text-transform:none}

/* KPI grid */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:10px;overflow:hidden}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{padding:12px 14px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);min-width:0}
.kpi .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:19px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.kpi .s{font-size:11.5px;color:var(--faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--pos)!important} .neg{color:var(--neg)!important}

/* Status text */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;white-space:nowrap;color:var(--muted)}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.c-ok{color:var(--pos)} .c-bad{color:var(--neg)} .c-warn{color:var(--warn)} .c-violet,.c-info,.c-teal,.c-orange,.c-gray,.c-brand,.c-vino,.c-indigo{color:var(--muted)}
.c-violet{color:var(--info)}
.pill.c-gray:before{background:transparent;border:1px solid currentColor}

/* Month rows (inicio) */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 16px;border-top:1px solid var(--line2);width:100%;text-align:left}
.mrow:first-child{border-top:0}
.mrow:active,.row:active{background:var(--soft)}
.mrow .t{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px}
.mrow .r{text-align:right;font-weight:600}
.mrow .m{font-size:12px;color:var(--muted)}
.mrow .bar{grid-column:1/3;margin-top:6px}
.bar{height:3px;border-radius:9px;background:var(--line);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--ink)}

/* Chart */
.chart{display:flex;align-items:flex-end;gap:10px;height:120px;padding:6px 0 0}
.ccol{flex:1;min-width:40px;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.cbars{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center}
.cbars span{width:12px;border-radius:2px 2px 0 0;min-height:2px}
.ccol small{font-size:10.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.legend{display:flex;gap:16px;font-size:11.5px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

/* Month tabs */
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 12px 10px;font-weight:600;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.chip.on{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px}
.filters::-webkit-scrollbar{display:none}
.chip.f{border:1px solid var(--line);border-radius:7px;padding:5px 10px;font-size:12.5px;margin:0;background:var(--card)}
.chip.f.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip .n{opacity:.6;font-weight:500}

/* Banner */
.banner{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px 10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:12.5px;color:var(--muted)}
.banner .tx{flex:1;min-width:0}
.banner .tx b{color:var(--ink);font-size:13.5px;margin-right:6px}
.banner .ic{display:none}
.b-open{border-left:3px solid var(--pos)}
.b-closed{border-left:3px solid var(--ink)}
.b-re{border-left:3px solid var(--warn)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;padding:10px 16px;border-radius:9px;background:var(--accent);color:#fff;white-space:nowrap}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--ink);color:var(--card)}
.btn.warn{background:var(--ink);color:var(--card)}
.btn.danger{background:transparent;color:var(--neg);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}

/* Progress */
.prog{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:12px;color:var(--muted)}
.prog .bar{flex:1}
.prog b{color:var(--ink)}

/* Segmented (underline) */
.seg{display:flex;gap:18px;border-bottom:1px solid var(--line)}
.seg button{padding:10px 0;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--ink);border-bottom-color:var(--accent)}
.sheet .seg{gap:0;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--soft)}
.sheet .seg button{flex:1;text-align:center;padding:8px 4px;border:0;border-radius:7px;margin:0;font-size:13px}
.sheet .seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* Registro rows */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:0 10px;margin-top:10px;color:var(--faint)}
.search input{border:0;outline:0;background:transparent;padding:8px 0;flex:1;min-width:0;font-size:15px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"con mon" "meta st";gap:1px 12px;padding:9px 14px;border-top:1px solid var(--line2);width:100%;text-align:left;align-items:baseline}
.rows .row:first-child{border-top:0}
.row .con{grid-area:con;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{grid-area:meta;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mon{grid-area:mon;text-align:right;font-weight:600}
.row .st{grid-area:st;text-align:right}
.row .cat,.row .dia,.row .pag,.row .sal{display:none}
.row.hd{display:none}
.row .tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--info);margin-left:6px}
.row.tot{background:var(--soft);font-weight:700}
@media(min-width:760px){
  .row{grid-template-columns:minmax(0,2.2fr) minmax(0,1.1fr) 44px 104px 104px 104px 112px;grid-template-areas:"con cat dia mon pag sal st";align-items:center;padding:9px 16px}
  .row .meta{display:none}
  .row .cat,.row .dia,.row .pag,.row .sal{display:block;font-size:13px;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .cat{text-align:left;grid-area:cat} .row .dia{grid-area:dia} .row .pag{grid-area:pag} .row .sal{grid-area:sal}
  .row.hd{display:grid;background:var(--soft);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);padding:8px 16px}
  .row.hd>*{font-size:10.5px!important;font-weight:700!important;color:var(--muted)!important}
}
.empty{text-align:center;color:var(--muted);padding:24px 10px;font-size:13.5px}
.notice{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);margin-top:10px;padding:8px 12px;border:1px dashed var(--line);border-radius:9px}
.notice b{color:var(--ink)}

/* Categorías (ranking) */
.crow{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:10px 0;border-top:1px solid var(--line2)}
.crow:first-child{border-top:0}
.crow .nm{font-weight:600}
.crow .bar{grid-column:1/3}
.crow .bar span{background:var(--ink)}
.crow:first-child .bar span{background:var(--accent)}
.crow .d{grid-column:1/3;font-size:11.5px;color:var(--muted)}

/* Tabbar + FAB */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:5px 6px calc(5px + var(--sab))}
.tabbar button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--faint);padding:4px 0;text-align:center}
.tabbar svg{width:22px;height:22px}
.tabbar button.on{color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(72px + var(--sab));z-index:31;width:52px;height:52px;border-radius:14px;background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(200,16,46,.3);display:grid;place-items:center}
.fab svg{width:24px;height:24px}

/* Sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,11,14,.42);opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--card);border-radius:16px 16px 0 0;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;transform:translateY(105%);transition:transform .24s cubic-bezier(.2,.8,.2,1);padding:6px 18px calc(18px + var(--sab));max-width:600px;margin:0 auto}
.sheet.on{transform:none}
@media(min-width:760px){.sheet{bottom:auto;top:50%;border-radius:14px;transform:translateY(-44%);opacity:0;transition:all .2s}.sheet.on{transform:translateY(-50%);opacity:1}}
.grab{width:36px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 2px;font-size:19px;font-weight:600;font-family:var(--serif);letter-spacing:-.01em}
.sheet .lead{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.sheet .kpis{margin-top:4px}
.f{margin-top:11px}
.f label{display:block;font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.07em}
.f input,.f select,.f textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px 11px;outline:0;-webkit-appearance:none;appearance:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ink)}
.f input:disabled,.f select:disabled,.f textarea:disabled{background:var(--soft);color:var(--muted)}
.f .hint{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.f .hint button{color:var(--accent);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:16px}
.acts .btn{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-top:10px;font-size:13px;background:var(--soft)}
.check input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.phrase{font-family:ui-monospace,Menlo,monospace;font-weight:700;border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:6px 10px;display:inline-block;margin:4px 0 8px;letter-spacing:.05em;user-select:all}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.sw.on{background:var(--accent)}
.sw.on:after{left:21px}
.readonly{border-left:3px solid var(--ink);background:var(--soft);border-radius:6px;padding:9px 12px;font-size:12.5px;margin-bottom:6px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(92px + var(--sab));transform:translateX(-50%) translateY(16px);z-index:80;background:var(--ink);color:var(--card);padding:10px 15px;border-radius:9px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.bad{background:var(--accent);color:#fff}

/* Bitácora */
.log{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line2);font-size:12.5px}
.log:first-child{border-top:0}
.log .li{width:7px;height:7px;border-radius:50%;background:var(--faint);margin-top:6px}
.log .li.a{background:var(--accent)}
.log .lt b{font-size:12.5px;font-weight:600}
.log .lt div{color:var(--muted);font-size:12px;margin-top:1px;word-wrap:break-word}

/* Setup */
.setup{max-width:440px;margin:0 auto;padding:calc(44px + var(--sat)) 22px 40px;text-align:center}
.setup .logo-big{width:84px;height:84px;border-radius:20px}
.setup h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:16px 0 4px}
.setup p{color:var(--muted)}
.setup textarea{width:100%;height:100px;border-radius:9px;border:1px solid var(--line);background:var(--field);padding:11px;font-size:14px;margin-top:10px}
.setup .card{text-align:left}
.steps{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px 12px 32px;margin-top:16px;font-size:13px}
.steps li{margin:5px 0}
.loader{display:grid;place-items:center;min-height:60vh;color:var(--muted);gap:10px}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.iconbtn.on{color:var(--accent);border-color:var(--accent)}
.bell{position:relative}
.bell .cnt{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;border:2px solid var(--card)}
.upd{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--ink);color:var(--card);font-size:12.5px;padding:8px 14px}
.upd .btn{background:var(--accent)}
.mut{color:var(--muted)}
.row.grp{background:var(--soft);padding:6px 14px;grid-template-areas:"con con"}
.row.grp .con{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row.prox{grid-template-columns:1fr auto auto;grid-template-areas:"con mon st" "meta mon st";align-items:center}
.row.prox .con{text-align:left;padding:0}
.row.prox .st{display:block}
@media(min-width:760px){.row.prox{grid-template-columns:minmax(0,1fr) 120px 90px;grid-template-areas:"con mon st" "meta mon st"}.row.prox .meta{display:block}}
.row.more{grid-template-areas:"con con";justify-items:center}
.row.more .con{color:var(--accent);font-weight:600;font-size:13px}
.welcome{margin-bottom:10px;font-size:13.5px}
.welcome p{color:var(--muted);margin:6px 0}
.welcome ol{margin:6px 0 0;padding-left:20px;color:var(--ink2)}
.welcome li{margin:4px 0}
.acct{display:flex;align-items:center;gap:12px}

    catch(e) { throw new Error(e.message); }
  }
  let r;
  try { r = await fetch(apiUrl(), {method:'POST', redirect:'follow', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({s: sesion(), fn, args})}); }
  catch(e) { const er = new Error('Sin internet o Google no responde.'); er.offline = true; throw er; }
  let j; try { j = await r.json(); } catch(e) { throw new Error('Respuesta inesperada del servidor. Revisa la implementación (acceso «Cualquier persona», versión nueva).'); }
  if (!j.ok) { const er = new Error(j.error); if (j.auth) { er.auth = true; LS.del('gj_sesion'); LS.del('gj_cache'); setTimeout(() => pantallaLogin(j.error), 50); } throw er; }

}

/* ================== Cálculos (mismas reglas del Excel) ================== */
function aplicado(m){ const liq = m.tipo === 'Ingreso' ? m.estatus === 'Cobrado' : m.estatus === 'Pagado'; return liq ? (m.abonado === '' ? n(m.monto) : n(m.abonado)) : n(m.abonado); }
const saldo = m => n(m.monto) - aplicado(m);
function fechaPago(mes, dia){ const [y, mm] = mes.split('-').map(Number); const ult = new Date(y, mm, 0).getDate(); return new Date(y, mm - 1, Math.min(dia, ult)); }
function semaforo(m){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const [y, mm] = m.mes.split('-').map(Number); const fin = new Date(y, mm, 0);
  const d = n(m.dia), fp = d > 0 ? fechaPago(m.mes, d) : null;
  if (m.tipo === 'Ingreso') {
    if (m.monto === '' && m.estatus !== 'Cobrado') return {k:'sinmonto', t:'○ Sin monto', c:'gray'};
    if (m.estatus === 'Cobrado' || (aplicado(m) > 0 && saldo(m) <= 0)) return {k:'ok', t:'✔ Cobrado', c:'ok'};
    if (hoy > fin || (fp && hoy > fp)) return {k:'vencido', t:'● Atrasado', c:'bad'};
    if (aplicado(m) > 0) return {k:'parcial', t:'◐ Parcial', c:'warn'};
    return {k:'pend', t:'● Por cobrar', c:'info'};
  }
  if (m.monto === '' && m.estatus !== 'Pagado') return {k:'sinmonto', t:'○ Sin monto', c:'gray'};
  if (m.estatus === 'Pagado' || (aplicado(m) > 0 && saldo(m) <= 0)) return {k:'ok', t:'✔ Pagado', c:'ok'};
  if (m.estatus === 'Transferir') return {k:'transf', t:'➜ Al sig. mes', c:'violet'};
  if (hoy > fin || (fp && hoy > fp)) return {k:'vencido', t:'● Vencido', c:'bad'};
  if (fp && (fp - hoy) / 864e5 <= 5) return {k:'porvencer', t:'● Por vencer', c:'warn'};
  if (aplicado(m) > 0) return {k:'parcial', t:'◐ Parcial', c:'warn'};
  return {k:'pend', t:'● Pendiente', c:'orange'};
}
function calc(mes){
  const mv = S.movimientos.filter(m => m.mes === mes);
  const ing = mv.filter(m => m.tipo === 'Ingreso'), gas = mv.filter(m => m.tipo === 'Gasto');
  const proyIngL = ing.filter(m => m.monto === '' && m.mesAnterior !== '' && m.estatus !== 'Cobrado');
  const proyGasL = gas.filter(m => m.monto === '' && m.mesAnterior !== '' && m.estatus !== 'Pagado' && m.estatus !== 'Transferir');
  const proyIng = sum(proyIngL, m => n(m.mesAnterior)), proyGas = sum(proyGasL, m => n(m.mesAnterior));
  const esperado = sum(ing, m => n(m.monto)) + proyIng, cobrado = sum(ing, aplicado);
  const gastos = sum(gas, m => n(m.monto)) + proyGas, pagado = sum(gas, aplicado);
  const transferido = sum(gas.filter(m => m.estatus === 'Transferir'), saldo);
  const pendiente = sum(gas, saldo) - transferido + proyGas;
  const debe = esperado - pagado - pendiente, real = cobrado - pagado;
  const base = gastos - transferido, avance = base <= 0 ? 0 : Math.min(1, pagado / base);
  const sems = gas.map(semaforo);
  return { mv, ing, gas, esperado, cobrado, porCobrar: esperado - cobrado, gastos, pagado, transferido, pendiente, debe, real, avance,
    proyIng, proyGas, nProyIng: proyIngL.length, nProyGas: proyGasL.length,
    vencidos: sems.filter(s => s.k === 'vencido').length, porVencer: sems.filter(s => s.k === 'porvencer').length, vacios: mv.filter(m => m.monto === '' && m.mesAnterior !== '').length };
}
/* Pagos por atender (mismas reglas que el aviso diario) */
function porAtender(){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const act = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0'), desde = sumarMes(act, -1);
  const out = [];
  S.movimientos.forEach(m => {
    const mi = mesInfo(m.mes); if (!mi || mi.estado === 'CERRADO') return;
    if (m.tipo !== 'Gasto' || m.mes < desde || m.monto === '' || m.estatus === 'Pagado' || m.estatus === 'Transferir' || saldo(m) <= 0) return;
    const [y, mm] = m.mes.split('-').map(Number), ult = new Date(y, mm, 0).getDate(), d = n(m.dia);
    const f = d > 0 ? new Date(y, mm - 1, Math.min(d, ult)) : new Date(y, mm - 1, ult);
    const dias = Math.round((f - hoy) / 864e5);
    if (dias <= 7) out.push({ m, f, dias });
  });
  return out.sort((a, b) => a.dias - b.dias);
}
function grupoAlerta(d){ return d < 0 ? 'Vencidos' : d === 0 ? 'Vence hoy' : d <= 3 ? 'En 3 días' : 'Esta semana'; }
function nPendientes(){ return S && S.admin ? S.admin.usuarios.filter(u => u.activo === 'Pendiente').length : 0; }
function nAlertas(){ const act = mesDefault(); return nPendientes() + porAtender().filter(x => x.dias <= 3).length + cortesProximos().length + (act ? excedidos(act).length : 0); }
function badge(){ try { const k = porAtender().filter(x => x.dias <= 0).length; if (navigator.setAppBadge) { k ? navigator.setAppBadge(k) : navigator.clearAppBadge(); } } catch(e) {} }

function semMes(c){ const u = n(S.config.umbralJusto) || 1000;
  if (!c.mv.length) return {t:'○ Sin datos', c:'gray'};
  if (c.debe < 0) return {t:'● Déficit', c:'bad'}; if (c.debe < u) return {t:'● Justo', c:'warn'}; return {t:'● Sobra', c:'ok'}; }
function mesInfo(mes){ return S.meses.find(m => m.mes === mes); }
function editable(mes){ const m = mesInfo(mes); if (!m) return false; if (m.estado === 'ABIERTO') return true;
  return m.estado === 'REABIERTO' && new Date(m.reabiertoHasta) > new Date(); }
const LOCK = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const UNLOCK = '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg>';
function lockIcon(m){ return m.estado === 'CERRADO' ? `<span style="color:var(--faint)">${LOCK}</span>` : m.estado === 'REABIERTO' ? `<span style="color:var(--warn)">${UNLOCK}</span>` : ''; }
function catColor(nombre, tipo){ const c = S.categorias.find(x => x.nombre === nombre && (!tipo || x.tipo === tipo)) || S.categorias.find(x => x.nombre === nombre);
  if (c) return c.color; let h = 0; for (const ch of String(nombre)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return PAL[h % PAL.length]; }
function mesDefault(){ const hoy = new Date(), act = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0');
  if (S.meses.some(m => m.mes === act)) return act; return S.meses.length ? S.meses[S.meses.length - 1].mes : null; }

function vCategoriasMes(c){
  const T = UI.catVista || 'Gasto', base = T === 'Gasto' ? c.gas : c.ing;
  const P = T === 'Gasto' ? presupuestosMes(UI.mes) : {};
  const grupos = {};
  base.forEach(m => { const k = m.categoria || (T === 'Gasto' ? 'Otros' : 'Otros ingresos'); (grupos[k] = grupos[k] || []).push(m); });
  if (T === 'Gasto') Object.keys(P).forEach(k => { if (P[k].tope && !grupos[k]) grupos[k] = []; });
  const filas = Object.entries(grupos).map(([k, l]) => { const t = sum(l, m => n(m.monto)), p = sum(l, aplicado), sd = sum(l.filter(m => m.monto !== '' && m.estatus !== 'Transferir'), saldo);
    const tope = P[k] ? P[k].tope : 0; return { k, l, t, p, sd, tope, pct: tope ? t / tope : 0 }; })
    .sort((a, b) => b.t - a.t || a.k.localeCompare(b.k));
  const totT = sum(filas, f => f.t) || 1, conTope = filas.filter(f => f.tope);
  if (!UI.catAbiertas) UI.catAbiertas = {};
  const abierta = k => UI.catAbiertas[T + '|' + k] !== false;
  const todasAbiertas = filas.every(f => abierta(f.k));
  const tono = f => !f.tope ? '' : f.pct >= 1 ? 'over' : f.pct >= 0.8 ? 'near' : 'okb';
  return `
  <div style="display:flex;align-items:center;gap:8px;margin-top:10px">
    <div class="filters" style="margin:0;flex:1"><button class="chip f ${T === 'Gasto' ? 'on' : ''}" data-act="catVista" data-t="Gasto">Gastos <span class="n">${c.gas.length}</span></button><button class="chip f ${T === 'Ingreso' ? 'on' : ''}" data-act="catVista" data-t="Ingreso">Ingresos <span class="n">${c.ing.length}</span></button></div>
    ${filas.length ? `<button class="link" style="color:var(--muted);font-weight:600;font-size:12.5px" data-act="catTodas" data-v="${todasAbiertas ? '0' : '1'}">${todasAbiertas ? 'Contraer todo' : 'Expandir todo'}</button>` : ''}
  </div>
  ${conTope.length ? `<div class="kpis">${kpi('Presupuesto total', fmt(sum(conTope, f => f.tope), true), conTope.length + (conTope.length === 1 ? ' categoría' : ' categorías'))}${kpi('Comprometido', fmt(sum(conTope, f => f.t), true), Math.round(sum(conTope, f => f.t) / (sum(conTope, f => f.tope) || 1) * 100) + '% del presupuesto', '', '', sum(conTope, f => f.t) > sum(conTope, f => f.tope) ? 'bad' : '')}</div>` : ''}
  ${!filas.length ? `<div class="card empty" style="margin-top:10px">Sin ${T === 'Gasto' ? 'gastos' : 'ingresos'} este mes.</div>` : ''}
  ${filas.map(f => { const ab = abierta(f.k); return `<div class="grupo ${tono(f)}">
    <button class="ghd" data-act="catToggle" data-k="${esc(f.k)}">
      <span class="gnm"><span class="chev ${ab ? 'on' : ''}">›</span>${esc(f.k)} <span class="mut" style="font-weight:500;font-size:12px">· ${f.l.length}</span></span>
      <b class="num">${fmt(f.t, true)}${f.tope ? `<span class="mut" style="font-weight:500"> / ${fmt(f.tope)}</span>` : ''}</b>
      <span class="gbar"><span style="width:${Math.min(100, f.tope ? f.pct * 100 : f.t / totT * 100)}%"></span></span>
      <span class="gmeta num">${f.tope ? `<b class="${f.pct >= 1 ? 'neg' : ''}" style="${f.pct >= 0.8 && f.pct < 1 ? 'color:var(--warn)' : ''}">${Math.round(f.pct * 100)}% del presupuesto</b> · ` : `${Math.round(f.t / totT * 1000) / 10}% del total · `}${T === 'Gasto' ? 'Pagado' : 'Recibido'} ${fmt(f.p)} · Saldo ${fmt(f.sd)}</span>

}

/* ================== Notificaciones push ================== */
function cargarScript(src){ return new Promise((ok, mal) => { if (document.querySelector('script[src="' + src + '"]')) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => mal(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); }); }
async function tokenPush(){
  const g = S.global, V = '10.12.2';
  await cargarScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-compat.js`);
  await cargarScript(`https://www.gstatic.com/firebasejs/${V}/firebase-messaging-compat.js`);
  if (!firebase.apps.length) firebase.initializeApp({ apiKey: g.firebaseApiKey, projectId: g.firebaseProjectId, messagingSenderId: g.firebaseSenderId, appId: g.firebaseAppId });
  const reg = await navigator.serviceWorker.ready;
  return firebase.messaging().getToken({ vapidKey: g.firebaseVapidKey, serviceWorkerRegistration: reg });
}
async function activarPush(){
  try {
    const p = await Notification.requestPermission();
    if (p !== 'granted') return toast('No diste permiso de notificaciones', true);
    toast('Activando notificaciones…');
    const t = await tokenPush();
    if (!t) throw new Error('No se obtuvo el token de notificaciones');
    if (await call('registrarDispositivo', t, dispositivo())) { LS.set('gj_push', t); render(); toast('Notificaciones activas en este dispositivo'); }
  } catch(e) { toast('No se pudieron activar: ' + e.message, true); }
}
async function refrescarPush(){
  try { if (!LS.get('gj_push') || Notification.permission !== 'granted' || !S.global.firebaseVapidKey) return;
    const t = await tokenPush(); if (t && t !== LS.get('gj_push')) { const r = await rpc('registrarDispositivo', t, dispositivo()); LS.set('gj_push', t); setState(r); } } catch(e) {}
}

function presupuestosMes(mes){
  const tope = {}; (S.presupuestos || []).forEach(p => { if (p.tipo === 'Gasto') tope[p.categoria] = n(p.monto); });
  const out = {};
  S.movimientos.filter(m => m.mes === mes && m.tipo === 'Gasto').forEach(m => { const k = m.categoria || 'Otros'; out[k] = out[k] || {t:0, p:0}; out[k].t += n(m.monto); out[k].p += aplicado(m); });
  Object.keys(tope).forEach(k => { out[k] = out[k] || {t:0, p:0}; });
  Object.keys(out).forEach(k => { out[k].tope = tope[k] || 0; out[k].pct = out[k].tope ? out[k].t / out[k].tope : 0; });
  return out;
}
function excedidos(mes){ const P = presupuestosMes(mes); return Object.entries(P).filter(([, v]) => v.tope && v.pct >= 1).map(([k, v]) => ({ k, ...v })); }
function cortesProximos(){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  return (S.planes || []).filter(p => p.tipo === 'Tarjeta' && p.activo !== 'No' && n(p.diaCorte)).map(p => {
    const f = proxDia(n(p.diaCorte)); return { p, f, dias: Math.round((f - hoy) / 864e5) }; }).filter(x => x.dias <= 1);
}
function proxDia(d){ const hoy = new Date(); hoy.setHours(0,0,0,0); let y = hoy.getFullYear(), m = hoy.getMonth();
  let f = new Date(y, m, Math.min(d, new Date(y, m + 1, 0).getDate())); if (f < hoy) { m++; f = new Date(y, m, Math.min(d, new Date(y, m + 1, 0).getDate())); } return f; }

function planInfo(p){
  const movs = S.movimientos.filter(m => m.concepto === p.concepto && m.tipo === 'Gasto');
  if (p.tipo === 'Tarjeta') {
    const ult = S.meses.length ? S.meses[S.meses.length - 1].mes : null;
    const mv = movs.filter(m => m.mes === ult)[0] || null;
    return { mv, corte: n(p.diaCorte) ? proxDia(n(p.diaCorte)) : null, pago: n(p.diaPago) ? proxDia(n(p.diaPago)) : null, ult };
  }
  const pagado = n(p.previo) + sum(movs, aplicado), total = n(p.total), restante = Math.max(0, total - pagado);
  const men = n(p.mensualidad), hechos = men ? Math.min(n(p.pagos) || 999, Math.floor((pagado + 0.01) / men)) : 0;
  const termina = p.inicio && n(p.pagos) ? sumarMes(p.inicio, n(p.pagos) - 1) : '';
  return { pagado, total, restante, pct: total ? Math.min(1, pagado / total) : 0, hechos, termina, liquidado: total && restante <= 0.009 };
}

    ${UI.online ? `<label class="abfile"><input type="file" id="compFile" accept="image/*,application/pdf" hidden><span>＋ Adjuntar foto o PDF</span></label>` : ''}
  </div></div>`;
}
function leerArchivo(file){
  return new Promise((ok, mal) => {
    if (file.type === 'application/pdf') { if (file.size > 6e6) return mal(new Error('El PDF pesa más de 6 MB.')); const r = new FileReader(); r.onload = () => ok({ b64: String(r.result).split(',')[1], mime: file.type, nombre: file.name }); r.onerror = () => mal(r.error); return r.readAsDataURL(file); }
    if (!/^image\//.test(file.type)) return mal(new Error('Solo fotos o PDF.'));
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      ok({ b64: c.toDataURL('image/jpeg', 0.78).split(',')[1], mime: 'image/jpeg', nombre: (file.name || 'foto').replace(/\.[^.]+$/, '') + '.jpg' }); };
    img.onerror = () => mal(new Error('No se pudo leer la imagen (si es HEIC, compártela como JPG).'));
    img.src = url;
  });
}
document.addEventListener('change', async e => {
  if (e.target.id !== 'compFile' || !e.target.files[0]) return;
  const id = sheetMov.cur && sheetMov.cur.id; if (!id) return;
  try { const f = await leerArchivo(e.target.files[0]);
    if (await call('subirComprobante', id, f.nombre, f.mime, f.b64)) { reabrirMovSheet(id); toast('Comprobante guardado en Drive'); } }
  catch(err) { toast(err.message, true); }
});
async function verComprobante(id){
  try { const r = await conProgreso('verComprobante', () => rpc('verComprobante', id), 'Listo');
    const bin = atob(r.base64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([u8], { type: r.mime }));
    const vuelta = sheetMov.cur ? sheetMov.cur.id : null;
    openSheet(`<h2>${esc(r.nombre)}</h2><p class="lead">Comprobante guardado en tu Google Drive</p>
      ${r.mime === 'application/pdf' ? `<iframe class="compview" src="${url}"></iframe>` : `<img class="compview" src="${url}" alt="">`}
      <div class="acts"><a class="btn ghost" href="${url}" download="${esc(r.nombre)}" target="_blank" rel="noopener">Descargar</a><button class="btn dark" data-act="${vuelta ? 'volverMov' : 'closeSheet'}" data-id="${vuelta || ''}">Volver</button></div>`);
  } catch(e) { toast(e.message, true); }
}

/* ================== v2.1 · Exportar PDF ================== */
function sheetExportar(){

    <div class="acts" style="flex-direction:column"><button class="btn" data-act="pdfBajar">Descargar PDF</button><button class="btn ghost" data-act="pdfMail">Enviar a mi correo (${esc(S.yo.email)})</button></div>`);
}
async function exportarPDF(enviar){
  const mes = UI.mes;
  try { const r = await conProgreso('exportarPDF', () => rpc('exportarPDF', mes, !!enviar), enviar ? 'Enviado' : 'PDF listo');
    if (r.enviado) { closeSheet(); return toast('PDF enviado a ' + r.a); }
    if (r.html) { const w = $('#sheet'); w.innerHTML = '<div class="grab"></div><h2>Vista del reporte</h2><p class="lead">En la vista previa se muestra el contenido; en tu app se descarga como PDF.</p><iframe class="compview" style="height:60vh;background:#fff"></iframe><div class="acts"><button class="btn ghost" data-act="closeSheet">Cerrar</button></div>'; w.querySelector('iframe').srcdoc = r.html; return; }
    const bin = atob(r.base64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    const file = new File([u8], r.nombre, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && (isIOS || /Android/.test(navigator.userAgent))) { try { await navigator.share({ files: [file], title: r.nombre }); closeSheet(); return; } catch(e) { if (e.name === 'AbortError') return; } }
    const url = URL.createObjectURL(file), a = document.createElement('a'); a.href = url; a.download = r.nombre; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000); closeSheet(); toast('PDF descargado');
  } catch(e) { toast(e.message, true); }
}

function solicitudHTML(u){

}
function cmpVer(a, b){ const x = String(a).split('.').map(Number), y = String(b).split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i] || 0) !== (y[i] || 0)) return (x[i] || 0) - (y[i] || 0); } return 0; }
let updMostrado = false;
async function ventanaActualizar(motivo){
  const ul = document.querySelector('.ulogo'); if (ul && !ul.style.backgroundImage) ul.style.backgroundImage = 'url("data:image/svg+xml;utf8,' + encodeURIComponent(LOGO.replace('class="logo"', 'xmlns="http://www.w3.org/2000/svg"')) + '")';
  if (updMostrado || sessionStorage.getItem('gj_updLater')) return;
  updMostrado = true;
  let nueva = '';
  try { const t = await (await fetch('sw.js?v=' + Date.now(), { cache: 'no-store' })).text(); const m = t.match(/v(\d+\.\d+\.\d+)/); if (m) nueva = m[1]; } catch(e) {}
  if (motivo === 'servidor' && S && S.global && S.global.apiVersion && (!nueva || cmpVer(nueva, S.global.apiVersion) < 0)) nueva = nueva || S.global.apiVersion;
  if (nueva && cmpVer(nueva, APP_VERSION) <= 0 && motivo !== 'sw') { updMostrado = false; return; }
  const d = $('#updModal'); if (!d) return;
  $('#updVer').innerHTML = `Tienes <b>v${APP_VERSION}</b>${nueva ? ` · disponible <b class="neg">v${nueva}</b>` : ''}`;
  d.classList.add('on');
}
async function aplicarActualizacion(){
  const b = $('#updGo'); if (b) { b.disabled = true; b.textContent = 'Actualizando…'; }
  try {
    if (swEspera) { swEspera.postMessage('skip'); setTimeout(() => location.reload(), 2500); return; }
    if ('serviceWorker' in navigator) { const reg = await navigator.serviceWorker.getRegistration(); if (reg) { await reg.update(); if (reg.waiting) { reg.waiting.postMessage('skip'); setTimeout(() => location.reload(), 2500); return; } } }
    if (window.caches) { const ks = await caches.keys(); await Promise.all(ks.map(k => caches.delete(k))); }
  } catch(e) {}
  location.reload();
}

Object.assign(ACT, {

    if (await call('resolverSolicitud', d.e, ap)) { toast(ap ? 'Aprobado: le avisamos por correo' : 'Solicitud rechazada'); if ($('#sheet').classList.contains('on')) sheetAlertas(); } },

/* ================== Sincronización en tiempo real ================== */
async function cargar(manual){
  UI.syncing = true; renderSync();
  try { setState(await rpc('estado')); if (manual) toast('Actualizado'); }
  catch(e) { if (e.offline) { UI.online = false; if (manual) toast('Sin conexión', true); } else toast(e.message, true); render(); }
  finally { UI.syncing = false; renderSync(); }
}
async function vigilar(){
  if (document.hidden || UI.busy || !S || window.MODO === 'demo') return;
  try { const v = await rpc('version'); UI.online = true;
    const vence = S.meses.some(m => m.estado === 'REABIERTO' && new Date(m.reabiertoHasta) <= new Date());
    if (v !== S.version || vence) await cargar(); else { UI.sync = new Date().toISOString(); renderSync(); } }
  catch(e) { if (e.offline) { UI.online = false; render(); } }
}
setInterval(vigilar, 15000);
setInterval(() => { renderSync(); document.querySelectorAll('[data-cd]').forEach(el => { const mn = Math.ceil((new Date(el.dataset.cd) - Date.now()) / 60000); el.textContent = Math.max(0, mn); if (mn <= 0 && window.MODO === 'demo') { RPC_.estado && setState(RPC_.estado()); } }); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) vigilar(); });
addEventListener('online', () => vigilar());
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (S) render(); });
addEventListener('appinstalled', () => { installEvt = null; toast('App instalada'); });

/* ================== Inicio de sesión ================== */
async function pantallaLogin(error){
  S = null;
  $('#app').innerHTML = `<div class="setup">${LOGO.replace('class="logo"', 'class="logo-big"')}
    <h1>Gastos Juances</h1><p>Inicia sesión con tu cuenta de Google.</p>
    <div id="gbtn" class="gbtn"><div class="spin"></div></div>
    ${error ? `<p class="neg" style="font-weight:600;font-size:13.5px">${esc(error)}</p>` : ''}
    <details class="pairbox"><summary>Tengo un código de vinculación</summary>
      <input id="pcode" inputmode="numeric" maxlength="7" placeholder="000 000" autocomplete="one-time-code">
      <button class="btn block dark" data-act="vincularCodigo" style="margin-top:8px">Vincular este dispositivo</button>
      <p class="mut" style="font-size:12px">Genéralo en otro dispositivo donde ya iniciaste sesión: Ajustes → Vincular otro dispositivo.</p></details>
    <p class="mut" style="font-size:12px;margin-top:22px">¿Primera vez? Inicia sesión con Google para solicitar acceso; el administrador recibirá tu solicitud.</p>
    ${installCard(false)}</div>`;
  if (window.MODO === 'demo') return;
  try {
    const pub = await rpc('publico');
    if (!pub.googleClientId) { $('#gbtn').innerHTML = '<p class="mut">El administrador aún no configura el inicio de sesión con Google (ID de cliente).</p>'; return; }
    await cargarScript('https://accounts.google.com/gsi/client');
    const redir = isIOS && isStandalone();
    google.accounts.id.initialize({ client_id: pub.googleClientId, ux_mode: redir ? 'redirect' : 'popup', login_uri: redir ? apiUrl() : undefined,
      callback: redir ? undefined : r => entrarCon('login', r.credential), auto_select: false, cancel_on_tap_outside: true, itp_support: true });
    $('#gbtn').innerHTML = '';
    google.accounts.id.renderButton($('#gbtn'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', locale: 'es', width: 280 });
  } catch(e) { $('#gbtn').innerHTML = `<p class="neg">${esc(e.offline ? 'Sin conexión con el servidor.' : e.message)}</p>`; }
}
async function entrarCon(fn, valor){
  try { const r = await conProgreso(fn, () => rpc(fn, valor, dispositivo()), 'Bienvenido'); LS.set('gj_sesion', r.sesion); shell(); setState(r.estado); toast('Bienvenido' + (r.estado.yo.nombre ? ', ' + r.estado.yo.nombre.split(' ')[0] : '')); refrescarPush(); }
  catch(e) { if (/^PENDIENTE:/.test(e.message)) pantallaPendiente(e.message.replace(/^PENDIENTE:\s*/, '')); else pantallaLogin(e.message); }
}
ACT.vincularCodigo = () => { const c = val('pcode').replace(/\D/g, ''); if (c.length !== 6) return toast('Escribe los 6 dígitos', true); entrarCon('vincular', c); };

/* ================== Actualizaciones de la app (service worker) ================== */
function vigilarSW(reg){
  const avisar = w => { swEspera = w; ventanaActualizar('sw'); };
  if (reg.waiting && navigator.serviceWorker.controller) avisar(reg.waiting);
  reg.addEventListener('updatefound', () => { const w = reg.installing; if (!w) return;
    w.addEventListener('statechange', () => { if (w.state === 'installed' && navigator.serviceWorker.controller) avisar(w); }); });
  let recargado = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recargado) { recargado = true; location.reload(); } });
  setInterval(() => reg.update().catch(() => {}), 15 * 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
  navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.ir === 'aprobar') irAprobar(); });
}

/* ================== Arranque ================== */
(function iniciar(){
  if (window.MODO === 'demo') { shell(); cargar(); return; }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').then(vigilarSW).catch(() => {});
  const h = location.hash.match(/s=([a-f0-9]{32,})/);
  if (h) { LS.set('gj_sesion', h[1]); history.replaceState(null, '', location.pathname); }
  if (!sesion()) return pantallaLogin();
  const cache = LS.get('gj_cache'); shell(); if (cache && cache.yo) { S = cache; UI.sync = null; render(); }
  const irA = /#aprobar/.test(location.hash); if (irA) history.replaceState(null, '', location.pathname);
  cargar().then(() => { refrescarPush(); if (irA) irAprobar(); });
})();
</script>
